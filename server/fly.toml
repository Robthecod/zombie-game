app = "zombie-chase-server"

primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

# The Node server listens on PORT 8080 (see server/index.js) — internal_port must match.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.ports]]
    port = 80
    handlers = ["http"]

  [[http_service.ports]]
    port = 443
    handlers = ["tls", "http"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
