name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # @capacitor/cli 8.x requires Node >= 22
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build React app
        working-directory: client
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          # Capacitor 8 generates JavaVersion.VERSION_21 bytecode targets — JDK 17 fails the build
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Matches compileSdkVersion 36 in client/android/variables.gradle
      - name: Install Android SDK components
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null || true

      # @capacitor/cli is a devDependency of the client — no global install needed
      - name: Sync Capacitor
        working-directory: client
        run: npx cap sync android

      - name: Build APK
        run: |
          cd client/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zombie-chase-debug-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
