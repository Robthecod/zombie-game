name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build React app
        working-directory: client
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -5

      - name: Install Capacitor CLI and Android platform
        working-directory: client
        run: |
          npm install -g @capacitor/cli
          npm install @capacitor/android

      - name: Sync Capacitor
        working-directory: client
        run: npx cap sync android

      - name: Build APK
        run: |
          chmod +x client/android/gradlew
          sed -i 's/\r$//' client/android/gradlew
          cd client/android && ./gradlew assembleDebug --no-daemon --stacktrace --info 2>&1 | tee gradle-log.txt
          echo "Exit code: $?"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zombie-chase-debug-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
